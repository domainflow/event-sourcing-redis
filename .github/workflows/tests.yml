name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Save vendor folder
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor
          compression-level: 0
          retention-days: 1

  static-analysis:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPStan
        run: composer phpstan

  lint:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHP CS Fixer
        run: composer lint

  audit:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run Composer audit
        run: composer audit

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      # A service container cannot pass a command to its image, and this
      # adapter refuses to start against a Redis that can lose events —
      # appendonly off, or any maxmemory-policy that evicts. Both are the
      # stock defaults, so the server has to be started with flags.
      - name: Start Redis with event-store durability settings
        run: |
          docker run -d --name redis -p 6379:6379 \
            redis:8.10 redis-server \
            --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPUnit
        run: composer test

  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        redis-tag: ['8.2', '8.10']
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      # A service container cannot pass a command to its image, and this
      # adapter refuses to start against a Redis that can lose events —
      # appendonly off, or any maxmemory-policy that evicts. Both are the
      # stock defaults, so the server has to be started with flags.
      - name: Start Redis with event-store durability settings
        run: |
          docker run -d --name redis -p 6379:6379 \
            redis:${{ matrix.redis-tag }} redis-server \
            --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPUnit Integration tests
        run: composer test-integration

  code-coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      # A service container cannot pass a command to its image, and this
      # adapter refuses to start against a Redis that can lose events —
      # appendonly off, or any maxmemory-policy that evicts. Both are the
      # stock defaults, so the server has to be started with flags.
      - name: Start Redis with event-store durability settings
        run: |
          docker run -d --name redis -p 6379:6379 \
            redis:8.10 redis-server \
            --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, redis

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run code coverage
        run: composer code-coverage

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.php-version }}
          path: build/coverage
          retention-days: 5
